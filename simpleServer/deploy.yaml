apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-server
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: simple-server
  template:
    metadata:
      labels:
        app: simple-server
    spec:
      containers:
      - name: simple-server
        image: fabiocalt/simple-server
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: simple-server-service
spec:
  selector:
    app: simple-server
  type: NodePort   # <-- Use NodePort for local access
  ports:
    - protocol: TCP
      port: 80           # Service port
      targetPort: 5000   # Pod container port
      nodePort: 30080    # External NodePort (must be 30000-32767)

